packages:
  - 'packages/*'
  - 'apps/*'
  # Test fixture apps. Real workspace members so they resolve `@rshono/core` through node_modules exactly
  # the way an installed app does — which is half of what they are there to check.
  - 'packages/*/test/fixtures/*'
# RSC internals are coupled across builds: react-server-dom-rspack reaches into
# ReactSharedInternals and emits a flight payload the matching react-dom must parse.
# A single resolution of each is enforced here so no transitive dep can split them.
overrides:
  react: 19.2.8
  react-dom: 19.2.8
  react-server-dom-rspack: 0.1.0
  '@rspack/core': 2.2.1
allowBuilds:
  esbuild: false
  # wrangler brings workerd, whose install script only picks the platform binary out of the optional
  # dependency that already carries it — `workerd --version` answers without it having run.
  workerd: false
minimumReleaseAgeExclude:
  - prettier-plugin-uncomment@1.0.0 || 1.0.1 || 1.0.2
