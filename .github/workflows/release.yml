name: Release

# A tag is what publishes, when this repo has npm credentials. `pnpm -r publish` reads the version from each
# manifest, so the tag has to be pushed *after* the version bump is committed — see the flow in
# CONTRIBUTING.md:
#
#   pnpm version:set <version>          # the two published manifests only, no tag
#   git commit -am "Release v<version>" && git tag -a v<version> -m v<version> && git push --follow-tags
#
# The -a is not optional: `--follow-tags` pushes annotated tags only, and a lightweight tag would stay on the
# machine that made it while the branch pushed without it.
#
# With no credentials the publish step is skipped rather than failed, and the tag still buys a full re-run of
# every gate against the tagged tree; `pnpm release` then publishes from a laptop, at the cost of provenance.
#
# The two packages ship together and share a version, which is why there is no changeset tooling here.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    # The `secrets` context is not available to a step-level `if`, so the token is lifted here, where it is,
    # purely so the publish step can ask whether it exists.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      # Reads the workflow's OIDC token, which is what mints the provenance attestation. Without this the
      # publish still works and the package simply has no verifiable link back to this commit.
      id-token: write
      # For the draft release at the end; the checkout itself only needs read.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The same gates as CI, re-run against the exact tagged tree rather than trusted from the branch: a
      # tag can point anywhere, and this is the last moment a broken release is still cheap.
      - name: Build the framework
        run: pnpm --filter @rshono/core build

      - name: Lint
        run: pnpm lint

      - name: Typecheck and test
        run: |
          pnpm --filter @rshono/core typecheck
          pnpm --filter @rshono/core test
          pnpm --filter testbed typecheck
          pnpm --filter @rshono/create typecheck
          pnpm --filter @rshono/create test

      # Refuses the publish unless the tag names the version the manifests carry, so a mistyped tag cannot
      # publish something nobody meant to.
      - name: Check the tag matches the version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          for pkg in packages/core packages/create; do
            declared=$(node -p "require('./$pkg/package.json').version")
            [ "$declared" = "$tagged" ] || { echo "$pkg is $declared but the tag says $tagged"; exit 1; }
          done

      # `--provenance` attaches a signed statement of which repo, workflow and commit built the tarball,
      # which npm shows on the package page and consumers can verify. It is the whole reason to prefer
      # publishing from here rather than from a laptop.
      #
      # Skipped when there is no token, because the failure mode is unhelpful: pnpm falls back to npm's OIDC
      # trusted publishing, and if no trusted publisher is registered for the package that exchange 404s too,
      # leaving an anonymous PUT that the registry also answers 404. Three different-looking errors, one
      # cause. Better to skip and annotate than to go red on a tag whose gates all passed.
      - name: Publish
        if: env.NPM_TOKEN != ''
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Note that nothing was published
        if: env.NPM_TOKEN == ''
        run: |
          echo "::warning title=Nothing published::No NPM_TOKEN secret, so the publish step was skipped. Every gate above ran against the tagged tree. Publish with 'pnpm release' locally, or add the secret (or register a trusted publisher on npm) and re-run this workflow."

      - name: Draft the release notes
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
