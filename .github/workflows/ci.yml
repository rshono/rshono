name: CI

# Every job here builds and exercises the two published packages, so a change that cannot reach them
# — the website, the root README, the release script — has nothing to prove and does not start a run.
# The two lists below must stay identical; Actions does not support YAML anchors.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      # A README is not shipped code. Listed after the glob above, so it wins.
      - '!packages/*/README.md'
      # `test` typechecks the testbed against the built declarations — the only check that what gets
      # published is usable by a consumer. Drop this to filter on the packages alone.
      - 'apps/testbed/**'
      # The RSC internals are coupled across builds and pinned by `overrides`, so a resolution change
      # breaks the framework without touching a line of it.
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
      # One config governs every package, so a rule change is a change to all of them.
      - 'eslint.config.mjs'
  pull_request:
    paths:
      - 'packages/**'
      - '!packages/*/README.md'
      - 'apps/testbed/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
      - 'eslint.config.mjs'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A manifest pin is what a consumer resolves; an override is what this repo resolves. When they drift,
      # the whole suite goes green against a resolution nobody publishes — so this runs before the gates that
      # would report that false green.
      - name: Check the exact pins agree
        run: pnpm check:pins

      # The type-aware rules need the same modules `tsc` resolves, and the apps reach the framework
      # through its published `exports` — which point at `dist/`. Without this step every
      # `@rshono/core` import lints as an unresolved type and the run fills with `no-unsafe-*`.
      - name: Build the framework
        run: pnpm --filter @rshono/core build

      # One config, one pass, every package.
      - name: Lint
        run: pnpm lint

  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in engines; 24 is current. Windows is here because the framework
        # resolves and compares absolute paths in a few places, which is exactly where it would break.
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck the framework
        run: pnpm --filter @rshono/core typecheck

      # Builds the package, then the unit, compression, minimal-app, dev and production e2e suites.
      - name: Test
        run: pnpm --filter @rshono/core test

      # The testbed is typechecked against the *built* declarations, which is the only check that
      # what gets published is usable by a consumer.
      - name: Typecheck the testbed against the published types
        run: pnpm --filter testbed typecheck

      # The scaffolder's own matrix: every combination of options it can produce, asserted in memory.
      # Cheap enough to run on every platform, and Windows is where its path handling would break.
      - name: Typecheck and test the scaffolder
        run: |
          pnpm --filter @rshono/create typecheck
          pnpm --filter @rshono/create test

  scaffold:
    name: scaffold (install and build a generated app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The scaffolder's codegen reads the framework's built output for the deploy targets and the
      # dependency pins, so the framework has to exist before it can build.
      - name: Build the framework
        run: pnpm --filter @rshono/core build

      # Packs the framework, scaffolds real apps from it and installs them from the registry, so this is
      # the job that catches what no assertion on generated file contents can: a manifest that will not
      # resolve, a tsconfig option the compiler has removed, a tool config key that was renamed.
      - name: Scaffold, install and build
        run: pnpm --filter @rshono/create test
        env:
          CREATE_RSHONO_E2E: '1'

  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @rshono/core exec playwright install --with-deps chromium

      # Soft navigation, prefetching, scroll restoration and the fatal overlay only exist in a real
      # browser; nothing in the node:test suite can reach them.
      - name: Browser tests
        run: pnpm --filter @rshono/core test:browser

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/core/playwright-report/
          retention-days: 7

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A tarball that is missing the compiled runtime, or that ships the whole repo, is a broken
      # release — and neither shows up in any other job.
      - name: Pack and inspect the tarball
        run: pnpm --filter @rshono/core pack --pack-destination "$RUNNER_TEMP"

      - name: Check the published entry points exist
        run: |
          tar -tzf "$RUNNER_TEMP"/rshono-core-*.tgz | sort > /tmp/files.txt
          for required in \
            package/dist/index.js \
            package/dist/index.d.ts \
            package/dist/runtime/context.js \
            package/dist/runtime/client.js \
            package/dist/runtime/entry.rsc.js \
            package/dist/runtime/entry.ssr.js \
            package/dist/runtime/entry.client.js \
            package/dist/builder/page-entry-loader.cjs \
            package/dist/builder/env-shadow-loader.cjs \
            package/bin/rshono.mjs
          do
            grep -qx "$required" /tmp/files.txt || { echo "missing from the tarball: $required"; exit 1; }
          done
          ! grep -q '^package/src/' /tmp/files.txt || { echo "the tarball should not ship src/"; exit 1; }
